    <!-- Oculta badge/banner/flag injetado pela Netlify -->
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[id*="nl-"],
      iframe[srcdoc*="netlify"],
      #netlify-badge,
      .netlify-badge,
      [data-netlify-badge],
      [data-testid="netlify-badge"],
      div[style*="netlify"],
      iframe[src*="netlify"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        clip: rect(0,0,0,0) !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      // Desativa e remove imediatamente o HUD/Badge injetado pela Netlify
      (function() {
        function removeNetlifyBadge() {
          const frames = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[id*="nl-"], script[src*="hud?variant="], script[data-nf-variant]');
          frames.forEach(el => el.remove());
        }
        removeNetlifyBadge();
        const observer = new MutationObserver(removeNetlifyBadge);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>
